<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agnes Tachyon — Dossier & Lab 3D</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            overflow: hidden;
            background: radial-gradient(circle at 50% 45%, #0e3b48 0%, #061c24 55%, #020b10 100%);
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: relative;
            z-index: 1;
        }
        .font-display {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Layer Penanda Titik Info 3D */
        #markers-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
            overflow: hidden;
        }

        .info-pin {
            position: absolute;
            width: 28px;
            height: 28px;
            transform: translate(-50%, -50%);
            border-radius: 9999px;
            background: rgba(13, 148, 136, 0.85);
            border: 2px solid rgba(204, 251, 241, 0.9);
            box-shadow: 0 0 14px rgba(45, 212, 191, 0.85), inset 0 0 6px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), background-color 0.25s ease, opacity 0.3s ease;
        }
        .info-pin::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 9999px;
            border: 1.5px solid #5eead4;
            animation: pulseRing 2.4s cubic-bezier(0.24, 0, 0.38, 1) infinite;
        }
        .info-pin:hover, .info-pin.active-pin {
            transform: translate(-50%, -50%) scale(1.25);
            background: #14b8a6;
            box-shadow: 0 0 22px rgba(94, 234, 212, 1);
        }
        .info-pin-dot {
            width: 7px;
            height: 7px;
            border-radius: 9999px;
            background-color: #ffffff;
        }

        @keyframes pulseRing {
            0% { transform: scale(1); opacity: 0.9; }
            75% { transform: scale(1.85); opacity: 0; }
            100% { transform: scale(1.85); opacity: 0; }
        }

        /* Tooltip Melayang saat Hover */
        #hover-tooltip {
            position: fixed;
            pointer-events: none;
            z-index: 20;
            transform: translate(-50%, -135%);
            opacity: 0;
            transition: opacity 0.18s ease, transform 0.18s ease;
        }
        #hover-tooltip.visible {
            opacity: 1;
            transform: translate(-50%, -150%);
        }

        /* Kartu Informasi Bawah (Glassmorphism) */
        #info-drawer {
            position: fixed;
            bottom: -100%;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 640px;
            z-index: 30;
            transition: bottom 0.55s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.4s ease;
            opacity: 0;
            pointer-events: none;
        }
        #info-drawer.open {
            bottom: 20px;
            opacity: 1;
            pointer-events: auto;
        }

        /* Scrollbar halus untuk teks lore panjang */
        .custom-scroll::-webkit-scrollbar {
            width: 5px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(94, 234, 212, 0.35);
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <!-- Kanvas 3D -->
    <div id="canvas-container"></div>

    <!-- Layer Titik Info 3D -->
    <div id="markers-layer"></div>

    <!-- Tooltip Hover -->
    <div id="hover-tooltip" class="bg-slate-900/90 text-teal-100 border border-teal-400/40 px-3.5 py-1.5 rounded-xl shadow-xl backdrop-blur-md text-xs font-medium flex items-center gap-2 whitespace-nowrap">

    <!-- Header & Kontrol Atas -->

        <!-- Tombol Kontrol Navigasi -->

                </svg>
                <span>Reset Kamera</span>

    </header>

    <!-- Panel Kartu Informasi Bawah (Glassmorphism) -->
    <section id="info-drawer" class="bg-slate-900/85 border border-teal-400/35 rounded-3xl shadow-2xl backdrop-blur-2xl overflow-hidden text-slate-100">

    <!-- Three.js & OrbitControls -->

            },

            {

            },

        // ============================================================================
        // 2. INISIALISASI SCENE, KAMERA ORTHOGRAPHIC ISOMETRIK & RENDERER
        // ============================================================================
        const container = document.getElementById('canvas-container');
        const markersLayer = document.getElementById('markers-layer');
        const scene = new THREE.Scene();

        // Kamera Orthographic Isometrik
        const frustumSize = 11.5;
        let aspect = window.innerWidth / window.innerHeight;
        const camera = new THREE.OrthographicCamera(
            (frustumSize * aspect) / -2,
            (frustumSize * aspect) / 2,
            frustumSize / 2,
            frustumSize / -2,
            0.1,
            100
        );

        const defaultCamPos = new THREE.Vector3(14, 12.2, 14);
        const defaultTarget = new THREE.Vector3(0, 1.35, 0);
        camera.position.copy(defaultCamPos);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.08;
        container.appendChild(renderer.domElement);

        // OrbitControls dengan Smooth Damping
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.target.copy(defaultTarget);
        controls.minZoom = 0.65;
        controls.maxZoom = 2.4;
        controls.maxPolarAngle = Math.PI / 2 - 0.06;
        controls.minPolarAngle = 0.25;
        controls.update();

        // State Animasi Fokus Kamera
        let isCameraAnimating = false;
        let desiredTarget = defaultTarget.clone();
        let desiredZoom = 1.0;
        let desiredCamPos = defaultCamPos.clone();

        // ============================================================================
        // 3. PENCAHAYAAN LABORATORIUM ISOMETRIK & PENDAR CYAN ALAS
        // ============================================================================
        const hemiLight = new THREE.HemisphereLight(0xdff9fb, 0x0b3948, 0.72);
        hemiLight.position.set(0, 12, 0);
        scene.add(hemiLight);

        const mainLight = new THREE.DirectionalLight(0xfffcf2, 1.15);
        mainLight.position.set(7.5, 13, 6.5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 1;
        mainLight.shadow.camera.far = 32;
        const d = 8.5;
        mainLight.shadow.camera.left = -d;
        mainLight.shadow.camera.right = d;
        mainLight.shadow.camera.top = d;
        mainLight.shadow.camera.bottom = -d;
        mainLight.shadow.bias = -0.0005;
        scene.add(mainLight);

        const rimLight = new THREE.DirectionalLight(0x5eead4, 0.45);
        rimLight.position.set(-8, 7, -6);
        scene.add(rimLight);

        // Lampu titik hijau neon dari Labu Erlenmeyer
        const flaskPointLight = new THREE.PointLight(0x76ff03, 1.2, 3.2);
        flaskPointLight.position.set(-1.35, 1.55, -2.55);
        scene.add(flaskPointLight);

        // Lampu dinding bulat & persegi panjang
        const wallBulbLight1 = new THREE.PointLight(0xe0f7fa, 0.65, 4.5);
        wallBulbLight1.position.set(-2.5, 3.35, -0.35);
        scene.add(wallBulbLight1);

        const wallBulbLight2 = new THREE.PointLight(0xe0f7fa, 0.55, 4.5);
        wallBulbLight2.position.set(-0.35, 2.95, 2.35);
        scene.add(wallBulbLight2);

        // ============================================================================
        // 4. TEKS ARSITEKTURAL "AGNES TACHYON LAB" TERBAGI DI BELAKANG DINDING 3D
        // ============================================================================
        function createArchitecturalTextPlane(text, subText, width, height) {
            const canvas = document.createElement('canvas');
            const scale = 4;
            canvas.width = width * 128 * scale;
            canvas.height = height * 128 * scale;
            const ctx = canvas.getContext('2d');

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Garis aksen teknis tipis di atas dan bawah
            ctx.strokeStyle = 'rgba(94, 234, 212, 0.35)';
            ctx.lineWidth = 3 * scale;
            ctx.beginPath();
            ctx.moveTo(canvas.width * 0.06, canvas.height * 0.18);
            ctx.lineTo(canvas.width * 0.94, canvas.height * 0.18);
            ctx.stroke();

            // Teks Utama Besar
            ctx.save();
            ctx.font = `800 ${54 * scale}px "Space Grotesk", "Inter", sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Glow Cyan Halus
            ctx.shadowColor = 'rgba(45, 212, 191, 0.55)';
            ctx.shadowBlur = 18 * scale;
            ctx.fillStyle = 'rgba(204, 251, 241, 0.92)';
            ctx.fillText(text, canvas.width / 2, canvas.height * 0.52);
            ctx.restore();

            // Sub-label teknis kecil
            if (subText) {
                ctx.font = `600 ${15 * scale}px "Inter", sans-serif`;
                ctx.textAlign = 'center';
                ctx.fillStyle = 'rgba(94, 234, 212, 0.65)';
                ctx.fillText(subText, canvas.width / 2, canvas.height * 0.82);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.anisotropy = 8;
            const mat = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                depthWrite: false,
                side: THREE.DoubleSide
            });

            return new THREE.Mesh(new THREE.PlaneGeometry(width, height), mat);

        // ============================================================================
        function createTileTexture() {
            const size = 1024;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Warna dasar teal mengilap
            ctx.fillStyle = '#257c8a';
            ctx.fillRect(0, 0, size, size);

            const tiles = 10;
            const step = size / tiles;

            for (let r = 0; r < tiles; r++) {
                for (let c = 0; c < tiles; c++) {
                    // Variasi halus tiap ubin
                    const shade = ((r + c) % 2 === 0) ? '#298695' : '#227583';
                    ctx.fillStyle = shade;
                    ctx.fillRect(c * step + 3, r * step + 3, step - 6, step - 6);

                    // Kilau halus di sudut ubin
                    const grad = ctx.createLinearGradient(c * step, r * step, (c + 1) * step, (r + 1) * step);
                    grad.addColorStop(0, 'rgba(255,255,255,0.12)');
                    grad.addColorStop(1, 'rgba(0,0,0,0.08)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(c * step + 3, r * step + 3, step - 6, step - 6);
                }
            }

            // Garis nat keramik gelap
            ctx.strokeStyle = '#113c44';
            ctx.lineWidth = 4;
            for (let i = 0; i <= tiles; i++) {
                ctx.beginPath();
                ctx.moveTo(i * step, 0);
                ctx.lineTo(i * step, size);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, i * step);
                ctx.lineTo(size, i * step);
                ctx.stroke();
            }

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            return tex;
        }

        function createWallTileTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#1f6f7d';
            ctx.fillRect(0, 0, 512, 256);

            const cols = 10;
            const rows = 4;
            const cw = 512 / cols;
            const rh = 256 / rows;

            ctx.strokeStyle = '#103c44';
            ctx.lineWidth = 3;
            for (let r = 0; r <= rows; r++) {
                ctx.beginPath();
                ctx.moveTo(0, r * rh);
                ctx.lineTo(512, r * rh);
                ctx.stroke();
            }
            for (let c = 0; c <= cols; c++) {
                ctx.beginPath();
                ctx.moveTo(c * cw, 0);
                ctx.lineTo(c * cw, 256);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 4;
            return tex;
        }

        function createPinboardTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 1024;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Latar papan putih-abu bersih
            ctx.fillStyle = '#e5ecee';
            ctx.fillRect(0, 0, 1024, 512);

            // Gambar sketsa rumus & kurva kecepatan samar di latar
            ctx.strokeStyle = 'rgba(30, 90, 105, 0.25)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(80, 420);
            ctx.bezierCurveTo(220, 120, 460, 380, 680, 90);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(320, 260, 85, 0, Math.PI * 2);
            ctx.stroke();

            // Tempelan catatan warna-warni (Pink, Teal, Putih, Kuning)
            const notes = [
                { x: 60, y: 55, w: 95, h: 110, c: '#f4b6c2', rot: -0.06, pin: '#e11d48' },
                { x: 185, y: 70, w: 145, h: 165, c: '#f9d5dc', rot: 0.04, pin: '#0d9488' },
                { x: 135, y: 265, w: 75, h: 75, c: '#2e8b9a', rot: -0.08, pin: '#fbbf24' },
                { x: 255, y: 280, w: 80, h: 80, c: '#257a88', rot: 0.05, pin: '#f43f5e' },
                { x: 375, y: 120, w: 110, h: 130, c: '#ffffff', rot: -0.04, pin: '#0284c7' },
                { x: 525, y: 85, w: 165, h: 245, c: '#247886', rot: 0.07, pin: '#fde047' },
                { x: 500, y: 235, w: 65, h: 75, c: '#f6a580', rot: -0.1, pin: '#ffffff' },
                { x: 730, y: 75, w: 95, h: 95, c: '#ffffff', rot: 0.03, pin: '#ec4899' },
                { x: 745, y: 210, w: 125, h: 115, c: '#f8d7df', rot: -0.05, pin: '#14b8a6' },
                { x: 895, y: 125, w: 80, h: 105, c: '#ffffff', rot: 0.06, pin: '#f59e0b' },
                { x: 875, y: 285, w: 95, h: 115, c: '#328f9e', rot: -0.04, pin: '#fb7185' }
            ];

            notes.forEach(n => {
                ctx.save();
                ctx.translate(n.x + n.w / 2, n.y + n.h / 2);
                ctx.rotate(n.rot);

                // Bayangan kertas
                ctx.fillStyle = 'rgba(0,0,0,0.12)';
                ctx.fillRect(-n.w / 2 + 4, -n.h / 2 + 6, n.w, n.h);

                // Kertas
                ctx.fillStyle = n.c;
                ctx.fillRect(-n.w / 2, -n.h / 2, n.w, n.h);

                // Garis tulisan simulasi
                ctx.fillStyle = (n.c === '#247886' || n.c === '#2e8b9a' || n.c === '#328f9e')
                    ? 'rgba(255,255,255,0.4)'
                    : 'rgba(30,41,59,0.28)';
                for (let l = 0; l < 4; l++) {
                    ctx.fillRect(-n.w / 2 + 12, -n.h / 2 + 24 + l * 14, n.w * 0.65, 4);
                }

                // Pin warna
                ctx.beginPath();
                ctx.arc(0, -n.h / 2 + 10, 6, 0, Math.PI * 2);
                ctx.fillStyle = n.pin;
                ctx.fill();

                ctx.restore();
            });

            const tex = new THREE.CanvasTexture(canvas);
            tex.anisotropy = 8;
            return tex;
        }

        const prevItemBtn = document.getElementById('prev-item-btn');
        const nextItemBtn = document.getElementById('next-item-btn');
        const resetCamBtn = document.getElementById('reset-cam-btn');
        const togglePinsBtn = document.getElementById('toggle-pins-btn');
        const pinStatusDot = document.getElementById('pin-status-dot');

        let hoveredGroup = null;
        let selectedIndex = -1;
        let pinsVisible = true;
        let pointerDownPos = { x: 0, y: 0 };

        function setGroupHighlight(group, active) {
            if (!group) return;
            group.traverse(child => {
                if (child.isMesh && child.material && child.material.emissive) {
                    if (active) {
                        child.material.emissive.setHex(0x14b8a6);
                        child.material.emissiveIntensity = Math.max(child.userData.origEmissiveIntensity, 0.35);
                    } else {
                        child.material.emissive.copy(child.userData.origEmissive);
                        child.material.emissiveIntensity = child.userData.origEmissiveIntensity;
                    }
                }
            });
        }

        function showTooltip(text, pinEl) {
            tooltipText.textContent = text;
            const rect = pinEl.getBoundingClientRect();
            tooltipEl.style.left = `${rect.left + rect.width / 2}px`;
            tooltipEl.style.top = `${rect.top}px`;
            tooltipEl.classList.add('visible');
        }

        function hideTooltip() {
            tooltipEl.classList.remove('visible');
        }

        function selectItemByIndex(idx) {
            selectedIndex = (idx + LORE_ITEMS.length) % LORE_ITEMS.length;
            const group = interactiveGroups[selectedIndex];
            const lore = group.userData.lore;

            // Perbarui kartu drawer
            drawerIcon.textContent = lore.icon;
            drawerTag.textContent = lore.tag;
            drawerCounter.textContent = `${String(selectedIndex + 1).padStart(2, '0')} / ${String(LORE_ITEMS.length).padStart(2, '0')}`;
            drawerTitle.textContent = lore.title;
            drawerDesc.textContent = lore.desc;
            drawerEl.classList.add('open');

            // Sorot pin aktif
            pinElements.forEach((p, i) => {
                p.element.classList.toggle('active-pin', i === selectedIndex);
            });

            // Fokuskan kamera ke objek di bagian atas-tengah layar agar tidak tertutup drawer bawah
            const worldCenter = new THREE.Vector3();
            new THREE.Box3().setFromObject(group).getCenter(worldCenter);
            // Geser target sedikit ke bawah (-0.42 Y) sehingga objek tampil di area atas-tengah layar
            desiredTarget.copy(worldCenter).add(new THREE.Vector3(0, -0.42, 0));
            desiredZoom = 1.62;
            isCameraAnimating = true;
        }

        function resetCameraView() {
            selectedIndex = -1;
            drawerEl.classList.remove('open');
            pinElements.forEach(p => p.element.classList.remove('active-pin'));

            desiredTarget.copy(defaultTarget);
            desiredCamPos.copy(defaultCamPos);
            desiredZoom = 1.0;
            isCameraAnimating = true;
        }

        // Event Pointer Move untuk Hover Glow & Tooltip
        renderer.domElement.addEventListener('pointermove', (e) => {
            const rect = renderer.domElement.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

            raycaster.setFromCamera(pointer, camera);
            const hits = raycaster.intersectObjects(interactiveMeshes, false);

            if (hits.length > 0) {
                const hitGroup = hits[0].object.userData.parentGroup;
                if (hoveredGroup !== hitGroup) {
                    setGroupHighlight(hoveredGroup, false);
                    hoveredGroup = hitGroup;
                    setGroupHighlight(hoveredGroup, true);
                }
                renderer.domElement.style.cursor = 'pointer';
                tooltipText.textContent = hoveredGroup.userData.lore.title;
                tooltipEl.style.left = `${e.clientX}px`;
                tooltipEl.style.top = `${e.clientY}px`;
                tooltipEl.classList.add('visible');
            } else {
                if (hoveredGroup) {
                    setGroupHighlight(hoveredGroup, false);
                    hoveredGroup = null;
                }
                renderer.domElement.style.cursor = 'grab';
                hideTooltip();
            }
        });

        renderer.domElement.addEventListener('pointerdown', (e) => {
            pointerDownPos = { x: e.clientX, y: e.clientY };
            // Hentikan animasi otomatis saat pengguna mulai menggeser kamera manual
            isCameraAnimating = false;
        });

        renderer.domElement.addEventListener('pointerup', (e) => {
            const dist = Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y);
            // Anggap sebagai klik murni jika pergeseran kursor < 6px
            if (dist < 6 && hoveredGroup) {
                selectItemByIndex(hoveredGroup.userData.index);
            }
        });

        // Tombol Kontrol UI
        closeDrawerBtn.addEventListener('click', () => {
            drawerEl.classList.remove('open');
            selectedIndex = -1;
            pinElements.forEach(p => p.element.classList.remove('active-pin'));
        });

        prevItemBtn.addEventListener('click', () => {
            selectItemByIndex(selectedIndex - 1);
        });

        nextItemBtn.addEventListener('click', () => {
            selectItemByIndex(selectedIndex + 1);
        });

        resetCamBtn.addEventListener('click', resetCameraView);

        togglePinsBtn.addEventListener('click', () => {
            pinsVisible = !pinsVisible;
            pinStatusDot.className = pinsVisible
                ? 'w-2 h-2 rounded-full bg-teal-400'
                : 'w-2 h-2 rounded-full bg-slate-500';
            markersLayer.style.display = pinsVisible ? 'block' : 'none';
        });

        // ============================================================================
        // 10. RESPONSIVE RESIZE & RENDER LOOP
        // ============================================================================
        window.addEventListener('resize', () => {
            aspect = window.innerWidth / window.innerHeight;
            camera.left = (frustumSize * aspect) / -2;
            camera.right = (frustumSize * aspect) / 2;
            camera.top = frustumSize / 2;
            camera.bottom = frustumSize / -2;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();

            // 1. Animasi Detail Hidup di Dalam Laboratorium
            atomSpinner.rotation.y = elapsed * 0.85;
            atomSpinner.rotation.x = Math.sin(elapsed * 0.7) * 0.15;

            const pulse = 0.75 + Math.sin(elapsed * 2.6) * 0.25;
            matNeonGreen.emissiveIntensity = pulse;
            flaskPointLight.intensity = 0.9 + Math.sin(elapsed * 2.6) * 0.35;

            // 2. Transisi Halus Fokus Kamera & Zoom
            if (isCameraAnimating) {
                controls.target.lerp(desiredTarget, 0.065);
                camera.zoom = THREE.MathUtils.lerp(camera.zoom, desiredZoom, 0.065);
                if (selectedIndex === -1) {
                    camera.position.lerp(desiredCamPos, 0.065);
                }
                camera.updateProjectionMatrix();

                if (
                    controls.target.distanceTo(desiredTarget) < 0.01 &&
                    Math.abs(camera.zoom - desiredZoom) < 0.01
                ) {
                    isCameraAnimating = false;
                }
            }

            controls.update();

            // 3. Proyeksi Posisi Titik Info 3D ke Layar 2D
            if (pinsVisible) {
                pinElements.forEach((item) => {
                    const projected = item.worldPos.clone().project(camera);
                    const x = (projected.x * 0.5 + 0.5) * window.innerWidth;
                    const y = (projected.y * -0.5 + 0.5) * window.innerHeight;
                    item.element.style.left = `${x}px`;
                    item.element.style.top = `${y}px`;
                });
            }

            renderer.render(scene, camera);
        }

        window.onload = function () {
            animate();
        };
    </script>
</body>
</html>
